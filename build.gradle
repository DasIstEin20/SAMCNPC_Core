plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()

repositories {
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'samcnpc_core'
            mods {
                samcnpc_core {
                    source sourceSets.main
                }
            }
        }
        client {}
        clientConfigSmoke {
            parent runs.client
            workingDirectory project.file('run-config-smoke')
            property 'samcnpc.configSmoke', 'true'
            mods { samcnpc_core { source sourceSets.test } }
        }
        clientAnimationSmoke {
            parent runs.client
            workingDirectory project.file('run-animation-smoke')
            property 'samcnpc.animationSmoke', 'true'
            mods {
                samcnpc_core {
                    source sourceSets.test
                }
            }
        }
        server { args '--nogui' }
        gameTestServer {}
        // ForgeGradle merges run configs by name: the base must sort before its children.
        gameTestServerChunkSave {
            taskName 'runChunkSmokeSave'
            parent runs.gameTestServer
            workingDirectory project.file('run-chunk-smoke')
            property 'forge.enabledGameTestNamespaces', 'samcnpc_chunk_smoke'
            property 'samcnpc.chunkSmokePhase', 'save'
            mods { samcnpc_core { source sourceSets.test } }
        }
        gameTestServerChunkLoad {
            taskName 'runChunkSmokeLoad'
            parent runs.gameTestServer
            workingDirectory project.file('run-chunk-smoke')
            property 'forge.enabledGameTestNamespaces', 'samcnpc_chunk_smoke'
            property 'samcnpc.chunkSmokePhase', 'load'
            mods { samcnpc_core { source sourceSets.test } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test:${kotlin_version}"
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'samcnpc-core'
    manifest {
        attributes([
            'Specification-Title': project.name,
            'Specification-Vendor': 'SAMCNPC',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'SAMCNPC'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('verifyProductionKotlin') {
    group = 'verification'
    doLast {
        def javaSources = fileTree('src/main') { include '**/*.java' }.files
        if (!javaSources.empty) {
            throw new GradleException("Production source must be Kotlin: ${javaSources.join(', ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionKotlin')
}

// Vanilla's GameTest runner reads editable SNBT fixtures from its working directory.
tasks.register('syncGameTestStructures', Copy) {
    from layout.projectDirectory.dir('src/main/resources/gameteststructures')
    into layout.projectDirectory.dir('run/gameteststructures')
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructures')
}

tasks.register('syncChunkSmokeStructures', Copy) {
    from layout.projectDirectory.dir('src/main/resources/gameteststructures')
    into layout.projectDirectory.dir('run-chunk-smoke/gameteststructures')
}

tasks.matching { it.name in ['prepareRunChunkSmokeSave', 'prepareRunChunkSmokeLoad'] }.configureEach {
    dependsOn tasks.named('syncChunkSmokeStructures')
}

['Save', 'Load'].each { phase ->
    tasks.matching { it.name == "runChunkSmoke${phase}" }.configureEach {
        def report = layout.projectDirectory.file("run-chunk-smoke/chunk-smoke-${phase.toLowerCase()}.txt").asFile
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
        }
        doLast {
            if (!report.text.startsWith('PASS ')) throw new GradleException("Chunk restart ${phase} smoke failed: ${report}")
        }
    }
}

tasks.matching { it.name == 'runChunkSmokeLoad' }.configureEach {
    mustRunAfter tasks.matching { it.name == 'runChunkSmokeSave' }
}

// Test sources join the mod only for this run; the driver is never shipped in the mod JAR.
tasks.matching { it.name == 'runClientAnimationSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-animation-smoke/animation-smoke-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
    }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) {
            throw new GradleException("Client animation smoke did not pass. See ${report} and run-animation-smoke/logs/latest.log")
        }
    }
}

tasks.matching { it.name == 'runClientConfigSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-config-smoke/config-smoke-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
    }
    doLast {
        if (!report.text.trim().endsWith('PASS')) throw new GradleException("Configuration client smoke failed: ${report}")
    }
}
