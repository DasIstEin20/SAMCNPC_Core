plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()

repositories {
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def suiteSmokeId = rootProject.ext.has('fullVerificationId') ? rootProject.ext.fullVerificationId : null
def respawnSmokeId = providers.gradleProperty('respawnSmokeId').getOrElse(suiteSmokeId ?: 'manual')
def chunkSmokeId = providers.gradleProperty('chunkSmokeId').getOrElse(suiteSmokeId ?: '')
if (!(respawnSmokeId ==~ /[A-Za-z0-9_-]+/) || !(chunkSmokeId ==~ /[A-Za-z0-9_-]*/)) {
    throw new GradleException('Smoke IDs must contain only letters, digits, underscores or hyphens')
}
def chunkSmokeDirectory = chunkSmokeId ? "run-chunk-smoke-${chunkSmokeId}" : 'run-chunk-smoke'

def coreGameTestDirectory = "run-gametest-${System.currentTimeMillis()}"

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'samcnpc_core'
            mods {
                samcnpc_core {
                    source sourceSets.main
                }
            }
        }
        client {}
        clientConfigSmoke {
            parent runs.client
            workingDirectory project.file('run-config-smoke')
            property 'samcnpc.configSmoke', 'true'
            mods { samcnpc_core { source sourceSets.test } }
        }
        clientFishingSmoke {
            parent runs.client
            workingDirectory project.file('run-fishing-smoke')
            property 'samcnpc.fishingSmoke', 'true'
            mods { samcnpc_core { source sourceSets.test } }
        }
        clientAnimationSmoke {
            parent runs.client
            workingDirectory project.file('run-animation-smoke')
            property 'samcnpc.animationSmoke', 'true'
            mods {
                samcnpc_core {
                    source sourceSets.test
                }
            }
        }
        clientSkinSmoke {
            parent runs.client
            workingDirectory project.file('run-skin-smoke')
            property 'samcnpc.skinSmoke', 'true'
            property 'samcnpc.skinFixtureDirectory', providers.gradleProperty('skinFixtureDirectory')
                .getOrElse(project.file('run-skin-smoke/fixtures').absolutePath)
            mods { samcnpc_core { source sourceSets.test } }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file(coreGameTestDirectory)
            mods { samcnpc_core { source sourceSets.test } }
        }
        serverRespawnSave {
            taskName 'runRespawnSmokeSave'
            parent runs.server
            workingDirectory project.file("run-respawn-smoke-${respawnSmokeId}")
            property 'samcnpc.respawnSmokePhase', 'save'
            mods { samcnpc_core { source sourceSets.test } }
        }
        serverRespawnLoad {
            taskName 'runRespawnSmokeLoad'
            parent runs.server
            workingDirectory project.file("run-respawn-smoke-${respawnSmokeId}")
            property 'samcnpc.respawnSmokePhase', 'load'
            mods { samcnpc_core { source sourceSets.test } }
        }
        // ForgeGradle merges run configs by name: the base must sort before its children.
        gameTestServerChunkSave {
            taskName 'runChunkSmokeSave'
            parent runs.gameTestServer
            workingDirectory project.file(chunkSmokeDirectory)
            property 'forge.enabledGameTestNamespaces', 'samcnpc_chunk_smoke'
            property 'samcnpc.chunkSmokePhase', 'save'
            mods { samcnpc_core { source sourceSets.test } }
        }
        gameTestServerChunkLoad {
            taskName 'runChunkSmokeLoad'
            parent runs.gameTestServer
            workingDirectory project.file(chunkSmokeDirectory)
            property 'forge.enabledGameTestNamespaces', 'samcnpc_chunk_smoke'
            property 'samcnpc.chunkSmokePhase', 'load'
            mods { samcnpc_core { source sourceSets.test } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test:${kotlin_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def identitySources = files(fileTree('src/main'), file('build.gradle'), rootProject.file('build.gradle'), rootProject.file('gradle.properties')).files
    def fingerprint = java.security.MessageDigest.getInstance('SHA-256')
    identitySources.sort { rootProject.relativePath(it).replace('\\', '/') }.each { source ->
        fingerprint.update(rootProject.relativePath(source).replace('\\', '/').getBytes('UTF-8'))
        fingerprint.update((byte) 0)
        fingerprint.update(source.bytes)
        fingerprint.update((byte) 0)
    }
    def buildId = fingerprint.digest().encodeHex().toString()
    inputs.property 'buildId', buildId
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, buildId: buildId
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'samcnpc-core'
    manifest {
        attributes([
            'Specification-Title': project.name,
            'Specification-Vendor': 'SAMCNPC',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'SAMCNPC'
        ])
    }
    finalizedBy 'reobfJar'
}

// Vanilla's GameTest development runner looks for editable SNBT scenes in the run directory,
// rather than on the resource path. Keep that fixture reproducible after a clean checkout.
tasks.register('syncGameTestStructures', Copy) {
    from layout.projectDirectory.dir('src/main/resources/gameteststructures')
    from layout.projectDirectory.dir('src/test/resources/gameteststructures')
    into layout.projectDirectory.dir("${coreGameTestDirectory}/gameteststructures")
    doLast {
        // Extended test arenas need reproducible terrain outside the small SNBT template too.
        project.file("${coreGameTestDirectory}/server.properties").text = '''level-name=world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
generate-structures=false
spawn-protection=0
difficulty=easy
'''
    }
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructures')
}

tasks.register('syncChunkSmokeStructures', Copy) {
    from layout.projectDirectory.dir('src/main/resources/gameteststructures')
    into layout.projectDirectory.dir("${chunkSmokeDirectory}/gameteststructures")
}

tasks.matching { it.name in ['prepareRunChunkSmokeSave', 'prepareRunChunkSmokeLoad'] }.configureEach {
    dependsOn tasks.named('syncChunkSmokeStructures')
}

['Save', 'Load'].each { phase ->
    tasks.matching { it.name == "runChunkSmoke${phase}" }.configureEach {
        def report = layout.projectDirectory.file("${chunkSmokeDirectory}/chunk-smoke-${phase.toLowerCase()}.txt").asFile
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
        }
        doLast {
            if (!report.text.startsWith('PASS ')) throw new GradleException("Chunk restart ${phase} smoke failed: ${report}")
        }
    }
}

tasks.matching { it.name == 'runChunkSmokeLoad' }.configureEach {
    mustRunAfter tasks.matching { it.name == 'runChunkSmokeSave' }
}

// The smoke driver is test code, loaded only by this run and never shipped in a mod JAR.
tasks.matching { it.name == 'runClientAnimationSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-animation-smoke/animation-smoke-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
    }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) {
            throw new GradleException("Client animation smoke did not pass. See ${report} and run-animation-smoke/logs/latest.log")
        }
    }
}


tasks.matching { it.name == 'runClientSkinSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-skin-smoke/skin-smoke-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
    }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) {
            throw new GradleException("Signed-profile skin integration failed. See " + report)
        }
    }
}

// Separate JVMs must retain the same isolated world; use a fresh respawnSmokeId for a new pair.
['Save', 'Load'].each { phase ->
    tasks.matching { it.name == "runRespawnSmoke${phase}" }.configureEach {
        def report = project.file("run-respawn-smoke-${respawnSmokeId}/respawn-smoke-${phase.toLowerCase()}.txt")
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
            // Project-scoped Minecraft EULA authorization is recorded in root AGENTS.md.
            new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
            def settings = new File(report.parentFile, 'server.properties')
            if (!settings.exists()) settings.text = '''server-ip=127.0.0.1
server-port=25576
online-mode=true
level-name=world
level-type=minecraft:flat
level-seed=0
generate-structures=false
view-distance=4
simulation-distance=4
max-players=1
spawn-protection=0
'''
        }
        doLast { if (!report.text.startsWith('PASS ')) throw new GradleException("Respawn restart smoke failed: ${report}") }
    }
}
tasks.matching { it.name == 'runRespawnSmokeLoad' }.configureEach {
    mustRunAfter tasks.matching { it.name == 'runRespawnSmokeSave' }
}


// In the full suite a failed save invalidates its dependent load; other tests can still continue.
if (suiteSmokeId != null) {
    tasks.matching { it.name == 'runChunkSmokeLoad' }.configureEach { dependsOn 'runChunkSmokeSave' }
    tasks.matching { it.name == 'runRespawnSmokeLoad' }.configureEach { dependsOn 'runRespawnSmokeSave' }
}

// The new transient entity must arrive, move and disappear in a real client.
tasks.matching { it.name == 'runClientFishingSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-fishing-smoke/fishing-smoke-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast { if (!report.text.startsWith('PASS ')) throw new GradleException("Fishing client smoke failed: ${report}") }
}

tasks.matching { it.name == 'runClientConfigSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-config-smoke/config-smoke-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
    }
    doLast {
        if (!report.text.trim().endsWith('PASS')) throw new GradleException("Configuration client smoke failed: ${report}")
    }
}

tasks.register('verifyProductionKotlin') {
    group = 'verification'
    doLast {
        def javaSources = fileTree('src/main') { include '**/*.java' }.files
        if (!javaSources.empty) {
            throw new GradleException("Production source must be Kotlin: ${javaSources.join(', ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionKotlin')
}

// A flaky retry can fail after vanilla's original batch tracker has already advanced. Its final
// aggregate/exit may still be green; an explicit required failure in this run always fails the gate.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def report = new File(workingDir, 'logs/latest.log')
        if (!report.isFile()) throw new GradleException("GameTest result log is missing: ${report}")
        def failures = []
        report.eachLine('UTF-8') { line ->
            if (line.contains('/ERROR]') && line.contains('LogTestReporter') && line.contains(' failed!')) failures.add(line)
        }
        if (!failures.isEmpty()) throw new GradleException("${failures.size()} required GameTest failure(s) despite runner exit: ${failures.first()}. See ${report}")
    }
}
